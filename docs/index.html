document.addEventListener('visibilitychange',()=>{if(!document.hidden&&page==='messages')updateMessages();});
function threads() {
  if(!account)return [];
  return applications.flatMap(application=>{
    const offer=all().find(item=>item.id===application.offer);
    if(!offer?.owner)return [];
    const company=account.role==='company';
    if(company?offer.owner!==account.email:application.email!==account.email)return [];
    return [{key:JSON.stringify([offer.id,application.email]),offer,application,partner:company?application.name:offer.company}];
  });
}
function messages(key) {
  return read('message:'+key, []);
}
function inbox() {
  const available=threads();
  const selected=available.find(item=>item.key===thread)??available[0];
  thread=selected?.key??'';
  return `<section class="shell section"><h2>${t('Messages','Messages')}</h2><p>${t('Retrouvez les échanges liés à vos candidatures.','Find conversations linked to your applications.')}</p>${!selected?'<div class="empty">'+t('Les conversations apparaissent après une candidature à une offre publiée par une entreprise.','Conversations appear after someone applies to an opening posted by a company.')+'</div>':`<div class="inbox"><aside aria-label="${t('Conversations','Conversations')}">${available.map(item=>`<button class="thread-link" data-thread="${esc(item.key)}" aria-current="${item.key===thread}"><strong>${esc(item.partner)}<span class="thread-count"></span></strong><span>${esc(title(item.offer))}</span></button>`).join('')}</aside><div class="thread-area"><div class="thread-heading"><h3>${esc(selected.partner)}</h3><span class="workspace-note">${esc(title(selected.offer))}</span></div><div class="thread-log" id="thread-log" role="log" aria-live="polite"></div>${form('chat',textarea(t('Écrire un message','Write a message'),'message'),t('Envoyer','Send message'))}</div></div>`}</section>`;
}
function readKey(key) {
  return 'read:'+JSON.stringify([account.role,account.email,key]);
}
function unreadIn(key) {
  return messages(key).slice(read(readKey(key),0)).filter(item=>item.role!==account.role).length;
}
function badge(count) {
  return count?'<span class="unread" aria-label="'+count+' '+t('messages non lus','unread messages')+'">'+(count>99?'99+':count)+'</span>':'';
}
function updateUnread() {
  const total=account?threads().reduce((sum,item)=>sum+unreadIn(item.key),0):0;
  const count=$('nav').querySelector('.message-count');
  if(count)count.innerHTML=badge(total);
  const menuCount=$('menu').querySelector('.message-count');
  if(menuCount)menuCount.innerHTML=badge(total);
  for(const item of $('main').querySelectorAll('[data-thread] .thread-count')){
    const key=item.closest('[data-thread]').dataset.thread;
    item.innerHTML=badge(unreadIn(key));
  }
}
function updateMessages() {
  const log=$('thread-log');
  if(!log)return;
  const items=messages(thread);
  log.innerHTML=items.length?items.map(message=>`<div class="bubble ${message.role===account.role?'mine':''}">${esc(message.text)}<time datetime="${esc(message.time)}">${new Date(message.time).toLocaleString(t('fr-TN','en-GB'),{dateStyle:'short',timeStyle:'short'})}</time></div>`).join(''):`<p class="muted">${t('Aucun message pour le moment.','No messages yet.')}</p>`;
  log.scrollTop=log.scrollHeight;
  if(!document.hidden && items.length!==read(readKey(thread),0))write(readKey(thread),items.length);
  updateUnread();
}
window.addEventListener('storage',event=>{
  if(event.key==='istic.applications')applications=read('applications',[]);
  if(event.key==='istic.offers')offers=read('offers',[]);
  if(page==='messages'&&event.key==='istic.message:'+thread)updateMessages();
  else if(event.key?.startsWith('istic.message:')||event.key?.startsWith('istic.read:')||['istic.applications','istic.offers'].includes(event.key))updateUnread();
  if(['istic.applications','istic.offers'].includes(event.key)&&page==='messages'&&!$('thread-log'))render();
});

  const received=applications.filter(a=>company?owned.some(o=>o.id===a.offer):a.email===account.email);
  const items=company?owned:all().filter(offer=>bookmarked(offer.id));
  return `<section class="shell section"><h2>${company?t('Espace entreprise','Company dashboard'):t('Espace étudiant','Student dashboard')}</h2><p>${esc(account.name)} · ${esc(account.email)}</p><div class="actions">${company?button(t('Publier une offre','Post an opening'),'post','primary'):button(t('Explorer les offres','Explore openings'),'browse','primary')}${button(t('Se déconnecter','Sign out'),'logout')}</div><div class="application-list"><h3>${company?t('Vos offres','Your openings'):t('Offres enregistrées','Saved openings')}</h3><div class="grid">${grid(items,t('Aucune offre pour le moment.','No openings yet.'))}</div><h3>${company?t('Candidatures reçues','Received applications'):t('Mes candidatures','My applications')}</h3><div class="grid">${received.length?received.map(a=>`<article class="card"><h3>${esc(title(all().find(o=>o.id===a.offer)))}</h3><div class="meta">${esc(company?a.name+' · '+a.email:all().find(o=>o.id===a.offer).company)}</div><div>${esc(a.message)}</div>${a.cv?`<div class="muted">CV · ${esc(a.cv)}</div>`:''}<div><span class="pill">${statusLabel(a.status)}</span></div>${company?reviewControl(a):''}${all().find(o=>o.id===a.offer)?.owner?`<button class="secondary" data-thread="${esc(JSON.stringify([a.offer,a.email]))}">${t('Ouvrir la conversation','Open conversation')}</button>`:''}</article>`).join(''):`<div class="empty">${t('Aucune candidature pour le moment.','No applications yet.')}</div>`}</div></div></section>`;
}
function render() {
  $('workspace').className=account?'workspace':'';
  $('nav').hidden=!account;
  $('menu').hidden=!account;
  $('menu').innerHTML=icon('menu')+t('Menu','Menu')+'<span class="message-count"></span>';
  $('menu').setAttribute('aria-label',t('Menu','Menu'));
  document.documentElement.lang=english?'en':'fr';
  $('language').textContent=english?'FR':'EN';
  $('language').setAttribute('aria-label',english?'Passer au français':'Switch to English');


  $('nav').innerHTML=account ? button(t('Fermer le menu','Close menu'),'close-menu','plain drawer-close')+button(t('Tableau de bord','Dashboard'),'dashboard:'+account.role,'plain')+button(t('Toutes les offres','All openings'),'browse','plain')+button(t('Stages','Internships'),'category:internships','plain')+button(t('Emplois','Jobs'),'category:jobs','plain')+button(t('Messages','Messages')+'<span class="message-count"></span>','messages','plain')+button(t('Mon profil','My profile'),'settings','plain') : '';
  $('footnote').textContent=t('ISTIC · Borj Cédria, Tunisie','ISTIC · Borj Cédria, Tunisia');
  const active=page==='home'?(category?'category:'+category:'browse'):page===account?.role?'dashboard:'+account.role:page;
  $('nav').querySelector('[data-action="'+active+'"]')?.setAttribute('aria-current','page');
  $('nav').setAttribute('aria-label',t('Navigation principale','Main navigation'));
  $('menu-backdrop').setAttribute('aria-label',t('Fermer le menu','Close menu'));
  $('main').innerHTML=page==='access'?access():page==='listing'?listingPage(selectedOffer):page==='messages'?inbox():page==='settings'?settings():page==='home'?home():dashboard();
  if(page==='messages')updateMessages();
  else updateUnread();
  if(page==='home'){
    updateList();
    for(const key of ['query','type','city']) $(key).addEventListener('input',event=>{filters[key]=event.target.value;updateList();});
  }
}
$('language').onclick=()=>{english=!english;write('english',english);render();};
$('home').onclick=event=>{event.preventDefault();navigate('home');};

document.addEventListener('click',event=>{
  const threadButton=event.target.closest('[data-thread]');
  if(threadButton){thread=threadButton.dataset.thread;navigate('messages');return;}
  const target=event.target.closest('[data-action]');
  if(!target)return;
  const [action,id]=target.dataset.action.split(':');
  const offer=all().find(item=>item.id===id);
  switch(action){
    case 'browse': category=''; filters.type=''; navigate('home');$('opportunities')?.scrollIntoView();break;
    case 'category': category=id; filters.type=''; navigate('home');$('opportunities')?.scrollIntoView();break;
    case 'password': {
      const input=$('password');
      input.type=input.type==='password'?'text':'password';
      target.textContent=input.type==='password'?t('Afficher','Show'):t('Masquer','Hide');
      break;
    }
    case 'close-menu': setMenu(false);$('menu').focus();break;
    case 'messages': navigate('messages');break;
    case 'settings': navigate('settings');break;
    case 'access': auth(id);break;
    case 'intent': intent=intent==='signup'?'signin':'signup';render();break;
    case 'fill': {
      const fields=$('auth').elements;
      fields.email.value=demo[role].email;
      fields.email.setCustomValidity('');
      fields.password.value='Istic2026!';
      if(fields.name) fields.name.value=demo[role].name;
      fields.email.focus();
      break;
    }
    case 'dashboard': if(account?.role===id)navigate(id);else auth(id);break;
    case 'demo': setAccount(demo[id]);break;
    case 'auth': auth(id);break;
    case 'post': post();break;
    case 'offer': selectedOffer=offer; navigate('listing');break;
    case 'back-offer': navigate('home');$('opportunities').scrollIntoView();break;
    case 'apply': apply(offer);break;
    case 'close': $('dialog').close();break;
    case 'logout': setAccount(null);break;
    case 'reset': filters={query:'',type:'',city:''};render();$('query').focus();break;
    case 'save': {
      if(account?.role!=='student')break;
      const current=saved[account.email]??[];
      const wasSaved=current.includes(id);
      saved[account.email]=wasSaved?current.filter(value=>value!==id):[...current,id];
      write('saved',saved);
      render();
      document.querySelector('[data-action="save:'+id+'"]')?.focus();
      msg(wasSaved?t('Offre retirée.','Opening removed.'):t('Offre enregistrée.','Opening saved.'));
      break;
    }
  }
});
document.addEventListener('change',event=>{
  const value=event.target.dataset?.review;
  if(!value||account?.role!=='company'||!Object.hasOwn(statuses,event.target.value))return;
  const [offerId,email]=JSON.parse(value);
  const application=applications.find(item=>item.offer===offerId&&item.email===email);
  if(!application||!all().some(offer=>offer.id===offerId&&offer.owner===account.email))return;
  application.status=event.target.value;
  write('applications',applications);
  event.target.closest('.card').querySelector('.pill').textContent=statusLabel(application.status);
  msg(t('Statut enregistré.','Status saved.'));
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  const data=Object.fromEntries([...new FormData(event.target)].map(([key,value])=>[key,value.trim()]));
  if(event.target.id==='chat'){
    if(!data.message||!threads().some(item=>item.key===thread))return;
    try { localStorage.setItem('istic.message:'+thread,JSON.stringify([...messages(thread),{role:account.role,text:data.message,time:new Date().toISOString()}])); }
    catch { msg(t('Le navigateur bloque le stockage des messages.','The browser is blocking message storage.'));return; }
    event.target.reset();
    updateMessages();
    event.target.elements.message.focus();
    return;
  }
  if(event.target.id==='auth'){
    data.email=data.email.toLowerCase();
    const email=event.target.elements.email;
    if(data.role==='student'&&!/@(?:[a-z0-9-]+\.)*ucar\.tn$/.test(data.email)){
      email.setCustomValidity(t('Utilisez une adresse @ucar.tn ou un sous-domaine UCAR.','Use an @ucar.tn address or a UCAR subdomain.'));
      email.reportValidity();
      email.addEventListener('input',()=>email.setCustomValidity(''),{once:true});
      return;
    }
    const key=data.role+':'+data.email;
    const sample=demo[data.role];
    if(data.email===sample.email && intent==='signin' && data.password==='Istic2026!'){
      setAccount(profiles[key]??sample);
      return;
    }
    if(intent==='signin'){
      if(!profiles[key] || data.password!=='Istic2026!')return msg(t('Identifiants incorrects.','Incorrect credentials.'));
      setAccount(profiles[key]);
      return;
    }
    if(!data.name)return msg(t('Saisissez un nom.','Enter a name.'));
    if(data.password!=='Istic2026!')return msg(t('Utilisez le mot de passe de test indiqué.','Use the test password shown.'));
    if(profiles[key] || data.email===sample.email)return msg(t('Ce compte existe déjà.','This account already exists.'));
    delete data.password;
    profiles[key]=data;
    write('profiles',profiles);
    intent='signin';
    setAccount(data);
  }
  if(event.target.id==='settings' && account){
    if(!data.name)return msg(t('Saisissez un nom.','Enter a name.'));
    account={...account,...data};
    profiles[account.role+':'+account.email]=account;
    write('profiles',profiles);
    tabStore.set(account);
    render();
    msg(t('Profil enregistré.','Profile saved.'));
  }
  if(event.target.id==='post'&&account?.role==='company'){
    if(!data.fr||!data.city||!data.description||!data.responsibilities||!data.requirements)return msg(t('Complétez les champs obligatoires.','Complete all required fields.'));
    offers=[{...data,id:'local-'+Date.now(),owner:account.email,company:account.name},...offers];
    write('offers',offers);
    $('dialog').close();
    navigate('company');
    msg(t('Offre publiée dans ce navigateur.','Opening published in this browser.'));
  }
  if(event.target.id==='apply'&&account?.role==='student'){
    const offer=all().find(item=>item.id===data.offer);
    if(!offer||isExpired(offer))return msg(t('Cette offre est clôturée.','This opening is closed.'));
    if(!data.message)return msg(t('Ajoutez un message.','Enter a message.'));
    if(applications.some(a=>a.offer===data.offer&&a.email===account.email))return;
    applications=[{...data,email:account.email,name:account.name},...applications];
    write('applications',applications);
    $('dialog').close();
    navigate('student');
    msg(t('Candidature enregistrée dans ce navigateur.','Application saved in this browser.'));
  }
});
render();

function setMenu(open){
  $('nav').classList.toggle('open',open);
  $('menu').setAttribute('aria-expanded',String(open));
  $('menu-backdrop').hidden=!open;
  if(open)$('nav').querySelector('.drawer-close')?.focus();
}
$('menu').onclick=()=>setMenu(!$('nav').classList.contains('open'));
$('menu-backdrop').onclick=()=>{setMenu(false);$('menu').focus();};

document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('nav').classList.contains('open')){setMenu(false);$('menu').focus();}});
</script></body></html>
